name: ts

on:
  push:
    branches: [main]
    paths-ignore: ['engine/**', 'docs/**']
  pull_request:
    paths-ignore: ['engine/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  TZ: UTC

# Coverage thresholds are advisory until a baseline is recorded (follow-up).
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (affected on PRs, all on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F="$(node scripts/ci/affected-filter.mjs origin/${{ github.base_ref }})"
          else F=ALL; fi
          if [ "$F" = "ALL" ]; then pnpm -r --if-present lint --max-warnings 0
          elif [ -n "$F" ]; then pnpm $F --if-present lint --max-warnings 0
          else echo "no affected packages"; fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package tests (JUnit and advisory coverage)
        env:
          JUNIT_DIR: ${{ github.workspace }}/test-results
          COVERAGE: '1'
          COVERAGE_DIR: ${{ github.workspace }}/coverage/api
        run: mkdir -p test-results && pnpm -r --if-present test
      - name: Script and tool tests (JUnit)
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-results/node.xml
          "scripts/**/*.test.mjs" "tools/**/*.test.mjs"
      - name: Job summary
        if: always()
        run: node scripts/ci/junit-summary.mjs test-results coverage >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ts-test-results
          path: |
            test-results
            coverage
          if-no-files-found: ignore

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
