name: windows-cli

on:
  pull_request:
    paths: ['engine/**', 'scripts/ci/windows-smoke.ps1', '.github/workflows/windows-cli.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cli-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build review-cli
        working-directory: engine
        run: cargo build --release --locked -p review-cli
      - name: Test CLI and repository crates
        working-directory: engine
        run: cargo test --locked -p review-cli -p repository
      - name: Smoke
        shell: pwsh
        run: ./scripts/ci/windows-smoke.ps1 -Binary engine/target/release/review.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item engine/target/release/review.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath review-x86_64-pc-windows-msvc.zip -Force
          (Get-FileHash review-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash | Set-Content review-x86_64-pc-windows-msvc.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: review-x86_64-pc-windows-msvc
          path: |
            review-x86_64-pc-windows-msvc.zip
            review-x86_64-pc-windows-msvc.zip.sha256

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review-x86_64-pc-windows-msvc
      - run: gh release upload "${{ github.ref_name }}" review-x86_64-pc-windows-msvc.zip review-x86_64-pc-windows-msvc.zip.sha256 --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
