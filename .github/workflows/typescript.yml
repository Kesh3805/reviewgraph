name: typescript

on:
  push:
    paths-ignore:
      - 'engine/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'engine/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Format
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test:ts

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: reviewgraph
          POSTGRES_PASSWORD: reviewgraph-test
          POSTGRES_DB: reviewgraph
        ports: ['35432:5432']
        options: >-
          --health-cmd "pg_isready -U reviewgraph -d reviewgraph"
          --health-interval 2s --health-timeout 3s --health-retries 60
      redis:
        image: redis:7.4.9-alpine
        ports: ['36379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      RG_TEST_DATABASE_URL: postgres://reviewgraph:reviewgraph-test@127.0.0.1:35432/reviewgraph
      RG_TEST_REDIS_URL: redis://127.0.0.1:36379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply engine migrations
        run: |
          for f in $(ls engine/migrations/*.sql | sort); do
            PGPASSWORD=reviewgraph-test psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 35432 -U reviewgraph -d reviewgraph -f "$f"
          done
      - name: Kysely type drift
        run: node scripts/db-types.mjs --check --database-url "$RG_TEST_DATABASE_URL"
      - name: API integration tests
        run: pnpm -F @reviewgraph/api test:integration
