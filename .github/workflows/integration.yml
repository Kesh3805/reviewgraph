name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Service containers are provided natively by the runner; no local Docker is needed to author this.
jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: reviewgraph
          POSTGRES_PASSWORD: reviewgraph-test
          POSTGRES_DB: reviewgraph
        ports: ['35432:5432']
        options: >-
          --health-cmd "pg_isready -U reviewgraph -d reviewgraph"
          --health-interval 2s --health-timeout 3s --health-retries 60
      redis:
        image: redis:7.4.9-alpine
        ports: ['36379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      RG_TEST_DATABASE_URL: postgres://reviewgraph:reviewgraph-test@127.0.0.1:35432/reviewgraph
      RG_TEST_REDIS_URL: redis://127.0.0.1:36379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply engine migrations
        run: |
          for f in $(ls engine/migrations/*.sql | sort); do
            PGPASSWORD=reviewgraph-test psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 35432 -U reviewgraph -d reviewgraph -f "$f"
          done
      - name: Kysely type drift
        run: node scripts/db-types.mjs --check --database-url "$RG_TEST_DATABASE_URL"
      - name: Regenerate Kysely types on drift
        if: failure()
        run: node scripts/db-types.mjs --database-url "$RG_TEST_DATABASE_URL" && git diff --stat
      - name: Upload regenerated types
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kysely-generated
          path: apps/api/src/db/generated.ts
      - name: API integration tests
        run: pnpm -F @reviewgraph/api test:integration

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: reviewgraph
          POSTGRES_PASSWORD: reviewgraph-test
          POSTGRES_DB: reviewgraph
        ports: ['35432:5432']
        options: >-
          --health-cmd "pg_isready -U reviewgraph -d reviewgraph"
          --health-interval 2s --health-timeout 3s --health-retries 60
      redis:
        image: redis:7.4.9-alpine
        ports: ['36379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 60
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ['36333:6333']
    env:
      DATABASE_URL: postgres://reviewgraph:reviewgraph-test@127.0.0.1:35432/reviewgraph
      REDIS_URL: redis://127.0.0.1:36379
      QDRANT_URL: http://127.0.0.1:36333
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.97'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine
      - name: Apply engine migrations
        run: |
          for f in $(ls engine/migrations/*.sql | sort); do
            PGPASSWORD=reviewgraph-test psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 35432 -U reviewgraph -d reviewgraph -f "$f"
          done
      - name: Rust integration tests
        working-directory: engine
        run: cargo test --workspace --features integration --locked
