name: docker

# Images are built on the CI runner only; local development never requires Docker.
on:
  pull_request:
    paths:
      ['infra/docker/**', 'engine/**', 'apps/**', 'packages/**', '.github/workflows/docker.yml']
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [engine, api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Skip until DEV-001 adds infra/docker/<image>.Dockerfile.
      - name: Check Dockerfile exists
        id: df
        run: |
          if [ -f "infra/docker/${{ matrix.image }}.Dockerfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::infra/docker/${{ matrix.image }}.Dockerfile not found; skipping (DEV-001)"; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.df.outputs.present == 'true'
      - name: Build (no push)
        if: steps.df.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          load: true
          tags: reviewgraph-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            GIT_SHA=${{ github.sha }}
      - name: Hardening checks
        if: steps.df.outputs.present == 'true'
        run: bash scripts/ci/image-hardening-check.sh reviewgraph-${{ matrix.image }}:ci ${{ matrix.image }}
      - name: Read-only rootfs smoke
        if: steps.df.outputs.present == 'true'
        run: bash scripts/ci/image-smoke.sh reviewgraph-${{ matrix.image }}:ci ${{ matrix.image }}
