[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# PostgreSQL adapters (the finding lifecycle store).
pg = ["dep:sqlx", "dep:opentelemetry", "dep:verification"]
# Database-backed tests; need TEST_DATABASE_URL (or DATABASE_URL) pointing at a Postgres server
# whose user may CREATE DATABASE. Plain `cargo test` never touches a database.
integration = ["pg"]

[dependencies]
verification = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
review-core.workspace = true
analysis-ir.workspace = true
graph-storage.workspace = true
codegraph.workspace = true
lang-typescript.workspace = true
repository.workspace = true
async-trait = "0.1"
blake3.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
sqlx.workspace = true
tempfile.workspace = true
