[package]
name = "diff-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Downstream lanes enable `features = ["testkit"]` to import `diff_engine::testkit`
# (fixture scenario loading and deterministic repo construction).
testkit = []

[dependencies]
review-core.workspace = true
repository.workspace = true
analysis-ir.workspace = true
thiserror.workspace = true
imara-diff.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
gix = { workspace = true, features = [
    "max-performance-safe",
    "revision",
    "blob-diff",
    "sha1",
    "sha256",
    "parallel",
] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
globset.workspace = true
rayon.workspace = true
blake3.workspace = true
regex.workspace = true
once_cell.workspace = true
semver.workspace = true
tempfile.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
pretty_assertions.workspace = true
lang-typescript.workspace = true
