[package]
name = "model-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# FakeGateway and other helpers for unit tests in `reviewers` and `verification`.
testing = []
# Redis-backed rate limiting (needs a Redis server only at run time).
redis = ["dep:redis"]
# PostgreSQL response cache and ledger writer.
pg = ["dep:sqlx"]
# Tests that need Redis (REDIS_URL, default redis://host.docker.internal:26379).
integration = ["redis", "pg"]

[dependencies]
review-core.workspace = true
telemetry.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
schemars.workspace = true
blake3.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait = "0.1"
serde_jcs = "0.2"
arc-swap = "1"
rust_decimal = "1"
sqlx = { workspace = true, optional = true }
redis = { version = "1", optional = true, default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde_yaml.workspace = true
jsonschema = { version = "0.58", default-features = false }
dashmap = "6"
uuid.workspace = true
httpdate = "1"
regex.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["http2"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
insta.workspace = true
tempfile.workspace = true
wiremock.workspace = true
model-gateway = { path = ".", features = ["testing"] }
criterion.workspace = true

[[bench]]
name = "gateway_request_hash"
harness = false

[[bench]]
name = "replay_lookup"
harness = false

[[bench]]
name = "router_route"
harness = false
