# Model price table (GW-008). Prices are USD per million tokens, as strings so they stay exact.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (standard, global routing,
# 5-minute cache writes). Reasoning tokens are already part of output tokens for both providers.
#
# `as_of` must be refreshed whenever the page is re-checked: a test fails when an entry is older
# than 120 days, which forces a review. OpenAI models are operator-configured in routing.yaml and
# are deliberately not priced here; add entries (with source and date) for the ids you enable.
# An unpriced model has no cost (cost_usd_micros = null); the budget pre-check then uses the most
# expensive priced model of the same provider.
version: 1
prices:
  - provider: anthropic
    model: claude-haiku-4-5
    usd_per_mtok: { input: "1", output: "5", cache_write: "1.25", cache_read: "0.10" }
    as_of: "2026-10-03"
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: anthropic
    model: claude-sonnet-5-5
    usd_per_mtok: { input: "2", output: "10", cache_write: "2.50", cache_read: "0.20" }
    as_of: "2026-10-03"
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: anthropic
    model: claude-opus-5-5
    usd_per_mtok: { input: "4", output: "20", cache_write: "5", cache_read: "0.20" }
    as_of: "2026-10-03"
    source: https://platform.claude.com/docs/en/about-claude/pricing
