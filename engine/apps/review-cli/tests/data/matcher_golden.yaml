# Hand-labelled (expectation, finding) pairs for the EVAL-002 matcher. `matches` is the human
# label: would a reviewer of the benchmark count this finding as the expected one?
- name: exact symbol, same category
  expectation: '{id: E1, categories: [correctness], symbol: "ts:src/a#A.run/method"}'
  finding: {category: correctness, symbol: "ts:src/a#A.run/method", path: src/a.ts, lines: [10, 12], text: run breaks}
  matches: true
- name: different symbol, no location
  expectation: '{id: E1, categories: [correctness], symbol: "ts:src/a#A.run/method"}'
  finding: {category: correctness, symbol: "ts:src/a#A.stop/method", path: src/a.ts, lines: [10, 12], text: stop breaks}
  matches: false
- name: symbol right, category incompatible
  expectation: '{id: E1, categories: [correctness], symbol: "ts:src/a#A.run/method"}'
  finding: {category: performance, symbol: "ts:src/a#A.run/method", path: src/a.ts, lines: [10, 12], text: slow}
  matches: false
