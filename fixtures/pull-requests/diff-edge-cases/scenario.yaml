name: diff-edge-cases
description: >-
  File-level edge cases for the diff engine: pure rename, rename with edit, deletion, new
  files, a binary PNG, a 3 MiB JSON file, CRLF conversion, a dist/ bundle, a vendor/ file, a
  minified script, a @generated file, package-lock.json and a function moved between files.
  The trees are generated by engine/crates/diff-engine/tests/golden_edge_cases.rs (binary and
  multi-MiB content is not committed); this directory holds the golden dispositions.
expected:
  dispositions: expected/dispositions.json
